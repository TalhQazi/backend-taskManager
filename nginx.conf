user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # Without this, responses to proxied requests are left uncompressed.
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript text/xml application/xml
               application/xml+rss image/svg+xml application/wasm;

    # Keep-alive connection pool to the backend. Without an upstream block each
    # proxied request opens (and tears down) a fresh TCP connection.
    upstream backend_app {
        server backend:5000;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name task.se7eninc.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        # HTTP/2 lets the browser multiplex all API calls over one connection.
        # Over HTTP/1.1 the browser caps out at ~6 concurrent requests per
        # origin, so a dashboard firing 15 calls was being serialised in waves.
        listen 443 ssl http2;
        server_name task.se7eninc.com;

        ssl_certificate /etc/letsencrypt/live/task.se7eninc.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/task.se7eninc.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 1. Route API requests to the Backend Container.
        #    This location previously forced `Connection: upgrade` on every API
        #    call, which prevented connection reuse — each request paid a fresh
        #    TCP handshake to the backend. WebSocket upgrades are handled by the
        #    more specific /api/socket.io/ location below, so plain API traffic
        #    now uses a pooled keep-alive connection instead.
        location /api {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffers 16 32k;
            proxy_buffer_size 32k;
            proxy_busy_buffers_size 64k;
        }

        # 2. Route Socket.io WebSockets to the Backend Container
        location /api/socket.io/ {
            proxy_pass http://backend_app/api/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Long-lived connections must not be reaped by the default 60s read timeout.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 3. Hashed build assets are immutable — let the browser keep them.
        location ~* ^/assets/.*\.(js|css|woff2?|svg|png|jpg|jpeg|gif|webp|avif)$ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # 4. Route all other requests to the Frontend Container
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
