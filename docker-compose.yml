version: '3.8'

services:
  # 1. Self-Hosted MongoDB
  mongodb:
    image: mongo:6.0
    container_name: taskmanager-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secure_mongodb_password_here
    ports:
      - "127.0.0.1:27017:27017" # Exposes to localhost only (secure)
    volumes:
      - mongo-data:/data/db
    networks:
      - taskmanager-network

  # 2. Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    restart: always
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://admin:secure_mongodb_password_here@mongodb:27017/taskmanager?authSource=admin
      - JWT_SECRET=your_jwt_secret_here
      - NODE_ENV=production
    volumes:
      - backend-uploads:/usr/src/app/uploads
    ports:
      - "5000:5000"
    networks:
      - taskmanager-network

  # 3. React/Vite Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    restart: always
    networks:
      - taskmanager-network

  # 4. Nginx Reverse Proxy (Traffic Router)
  nginx:
    image: nginx:alpine
    container_name: taskmanager-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - taskmanager-network

networks:
  taskmanager-network:
    driver: bridge

volumes:
  mongo-data:
  backend-uploads:
